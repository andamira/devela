# devela manifest
# ==============================================================================
#
## Table of Contents
#
# * [lib]
#
# * [package]
#   - [metadata.docs.rs]
#
# * [features]
#   - Development       (__*)
#   - Environment       (std,alloc,no_std)
#   - Module            (all,code,data,error,geom,lang,media,num,org,phys,run,sys,text,ui,work,yard)
#   - Safety            (safest,safe,unsafe,…)
#   - Scope             (_*)
#     - default         (_max,_maxest)
#     - docs            (_docs, _docs_[examples|min|nodep|max])
#     - code            (_unroll*)
#     - data            (_data*,_tuple*,…)
#   - Dependency        (dep_*)
#   - Workspace         (devela_*)
#
# * [dependencies] (required|optional)
# * [dev-dependencies]
# * [build-dependencies]
#
# * [badges]
# * [lints]
#
# * [[bench]]           perf/
# * [[bin]]             src/bin/
# * [[example]]         examples/

[lib]
path = "src/_.rs"
bench = false

[package]
name = "devela"
build = "build/mod.rs"
description = "A development substrate of coherence."
readme = "docs/readme_crate.md"
rust-version.workspace = true
edition.workspace = true
version.workspace = true
documentation.workspace = true
authors.workspace = true
license.workspace = true
categories = ["development-tools", "rust-patterns", "no-std::no-alloc"]
keywords = ["dev", "helper", "library", "std", "extension"]
repository = "https://github.com/andamira/devela"
autoexamples = false
autobenches = false
# autobins = false
publish = true
include = [
	"/Cargo.toml",
	## source code
	"/build/**/*.rs", "/build/**/*.md", "/build/dep_all",
	"/src/**/*.rs", "/src/**/*.md",
	"/src/**/*.html", "/src/**/*.js", "/src/**/*.x",
	## documentation
	"/docs/nightly.md", "/docs/vendored*.md", "/LICENSE*",
	## examples included from /src/_doc
	# (omitted local examples are stripped from the packaged manifest)
	"/examples/work/coro_manager.rs",
	## programs
	# "",
	## assets
	"/assets/font/termivela/*.md",
	"/assets/font/termivela/*.txt",
	"/assets/font/termivela/*.toml",
	"/assets/font/termivela/termivela-8x16-bold.dvbf",
	"/assets/font/termivela/termivela-8x16-regular.dvbf",
	## exclusions
	"!**/_wip/**",
]

[package.metadata.docs.rs]
# ==============================================================================
# https://docs.rs/about/metadata
# https://github.com/rust-lang/crates-build-env/blob/master/linux/packages.txt
# [maximum build limits](https://docs.rs/crate/devela/latest/builds)
no-default-features = true
features = ["_docs", "__publish"]
rustc-args = [
	"--cfg", "nightly",
	"-Ctarget-cpu=native",
]
rustdoc-args = [
	"-Ctarget-cpu=native",
	"--generate-link-to-definition",
	"--html-in-header", "./src/_doc/header.html",
	"--cfg", "nightly",
]
default-target = "x86_64-unknown-linux-gnu"
targets = [ ## +std:
	"aarch64-apple-darwin", "x86_64-pc-windows-msvc",
	# "armv7-unknown-linux-gnueabihf", "aarch64-unknown-linux-gnu",
	# "riscv32gc-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu",
	# "wasm32-wasip1",
	## no_std:
	# "i686-unknown-uefi", "x86_64-unknown-none",
	# "thumbv7m-none-eabi", "aarch64-unknown-unknown"
	# "riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf",
	"wasm32-unknown-unknown",
]


[features] # 146/300 (154 remaining), 119 visible, 27 hidden
# ==============================================================================
# https://doc.rust-lang.org/cargo/reference/features.html

# Features are grouped in the following categories:
# - Development      __*
# - Environment      alloc, [no_]std
# - Module           …
# - Safety           [un]safe_*, …
# - Scope             _*
# - Dependency       dep_*
#
# Sintax:
# - ["name"]: Visible public-facing features.
# - ["_name"]: Hidden additional scope features.
# - ["__name"]: Development & maintenance features.
#
# Notes:
# - Features are in sync with build/main/features.rs & src/_doc/features.md.
# - List and count features with `./tools/manifest.sh features`.


#* Development features *#
# ------------------------------------------------------------------------------

__dbg = [] # shows extra debugging information
__std = [ # disables `no_std` in base crates for testing
	"std",
]

# enabled when publishing to crates.io or building online docs (see /src/code/util/_doclink!)
__publish = [
	"devela_macros/__publish",
]

__docs_internal = [ # enables documentation for internal items
	"devela_macros/__docs_internal",
]
__disable_native_libs = [] # disables native libraries from being detected
__exclude_test = [] # excludes specific examples from being tested
__force_miri_dst = [] # inhibits disabling miri on several modules


#* Environment features *#
# ------------------------------------------------------------------------------

alloc = [ # enables `alloc` functionality
	"jiff?/alloc",
	"memchr?/alloc", "portable-atomic-util?/alloc",
]
std = [ # disables `no_std` compatibility and enables `std` functionality
	"alloc",
	"atomic?/std", "jiff?/std", "log?/std",
	"memchr?/std", "portable-atomic-util?/std", "raw-cpuid?/std",
	"simdutf8?/std", "wide?/std",
]
no_std = [] # enables functionality incompatible with or substitute of `std`


