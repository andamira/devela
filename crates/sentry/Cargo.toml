# devela_sentry manifest
# ==============================================================================
[workspace]
resolver = "3"
members = [
    "probes/num",
    "probes/arch",
]
default-members = ["."]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
devela = { path = "../devela", default-features = false }

[package]
name = "devela_sentry"
description = "Downstream validation and probes for devela"
repository = "https://github.com/andamira/devela/tree/main/crates/sentry"
edition.workspace = true
publish.workspace = true

[dependencies]
devela = { workspace = true, features = ["dep_rand_core"] }

[profile.inspect]
inherits = "release"
opt-level = "s"
codegen-units = 1
panic = "abort"
lto = false

