# devela_bridge manifest
# ==============================================================================
[workspace]
[package]
name = "devela_bridge"
description = "Foreign-language bindings and ABI bridges for devela"
repository = "https://github.com/andamira/devela/tree/main/crates/bridge"
# documentation = "https://docs.rs/devela_bridge"

# version.workspace = true
# rust-version.workspace = true
# edition.workspace = true
# authors.workspace = true
# license.workspace = true
edition = "2024"

publish = false
include = [
	"/Cargo.toml",
	# "/LICENSE*",
	"/src/**/*.rs", "/src/**/*.md",
	# "/build/**/*",
	# "/include/*.*",
	# "/odin/*.*",
	# never publish WIP material
	"!**/_wip/**",
]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]

alloc = ["devela/alloc"]
std = ["devela/std"]

linux = ["devela/linux"]
term = ["devela/term"]
event = ["devela/event"]

[dependencies.devela]
path = "../devela"
features = ["unsafe_ffi"]

[profile.release]
panic = "abort"

[[bin]]
name = "ffi_bindgen"
path = "src/bin/ffi_bindgen.rs"
